version: 1.{build}
skip_tags: true
image: Visual Studio 2022
configuration: Release
platform:
- Win64

install:
- cmd: premake5.bat

build:
  project: build/Voxel.sln
  verbosity: minimal

for:
-
  matrix:
    only:
      - platform: Win64
  after_build:
    - cmd: 7z a d3d12_x64.zip %APPVEYOR_BUILD_FOLDER%\data\x64\d3d12.dll
  artifacts:
    - path: d3d12_x64.zip
      name: d3d12_x64

matrix:
  fast_finish: true
